<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Compare statutory employee benefits across the UK, Ireland, Germany and the Netherlands. An independent portfolio project."
    />
    <title><%= htmlPlugin.options.title %></title>

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#2340cc" />

    <!-- Link previews (Slack, LinkedIn, iMessage and so on). Images need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Parity" />
    <meta property="og:title" content="Parity: statutory benefits, compared across countries" />
    <meta
      property="og:description"
      content="Compare legal minimums for leave, pay and pensions in the UK, Ireland, Germany and the Netherlands, from official sources, and ask questions about the data."
    />
    <meta property="og:url" content="https://parity.usmankadai.dev/" />
    <meta property="og:image" content="https://parity.usmankadai.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Parity: a table comparing annual leave in the United Kingdom, Germany and the Netherlands"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>Parity needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
